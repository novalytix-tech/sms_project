<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="bgGradMaleDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="100%" stop-color="#fedfd8"/>
    </linearGradient>
    <linearGradient id="blazerGradMaleDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tieGradMaleDef" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ad1e2b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="skinGradMaleDef" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5cbb1"/>
      <stop offset="100%" stop-color="#e8b497"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="280" rx="20" fill="url(#bgGradMaleDef)" />

  <!-- Background subtle halo -->
  <circle cx="120" cy="115" r="75" fill="#fde2db" opacity="0.8"/>

  <!-- Neck & Collar Base -->
  <path d="M106 142 L134 142 L138 178 L102 178 Z" fill="#deb095" />
  
  <!-- White School Shirt Collar -->
  <polygon points="90,165 120,195 106,170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <polygon points="150,165 120,195 134,170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Crimson School Tie -->
  <polygon points="114,170 126,170 129,182 120,188 111,182" fill="url(#tieGradMaleDef)"/>
  <polygon points="113,184 127,184 132,250 120,265 108,250" fill="url(#tieGradMaleDef)"/>
  <line x1="114" y1="200" x2="126" y2="212" stroke="#fecaca" stroke-width="2" opacity="0.6"/>
  <line x1="112" y1="222" x2="128" y2="238" stroke="#fecaca" stroke-width="2" opacity="0.6"/>

  <!-- Navy School Blazer -->
  <path d="M40 280 L40 230 C40 200 65 180 88 172 L106 215 L106 280 Z" fill="url(#blazerGradMaleDef)" />
  <path d="M200 280 L200 230 C200 200 175 180 152 172 L134 215 L134 280 Z" fill="url(#blazerGradMaleDef)" />
  <polygon points="88,172 108,225 120,200 106,170" fill="#2d3748" />
  <polygon points="152,172 132,225 120,200 134,170" fill="#2d3748" />
  
  <!-- School Crest Pin on Blazer -->
  <circle cx="68" cy="225" r="7" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="68,220 73,224 71,230 65,230 63,224" fill="#fef3c7"/>

  <!-- Face -->
  <path d="M84 92 C84 62 156 62 156 92 C156 128 144 154 120 154 C96 154 84 128 84 92 Z" fill="url(#skinGradMaleDef)" />

  <!-- Ears -->
  <ellipse cx="82" cy="100" rx="6" ry="11" fill="#deb095"/>
  <ellipse cx="158" cy="100" rx="6" ry="11" fill="#deb095"/>

  <!-- Hair -->
  <path d="M80 86 C80 48 102 36 120 36 C140 36 160 48 160 86 C160 90 155 86 152 82 C146 76 138 74 130 74 C116 74 106 78 98 82 C90 86 80 89 80 86 Z" fill="#1e1b18" />
  <path d="M86 64 C96 46 122 42 144 48 C154 52 161 64 161 74 C158 60 148 48 130 46 C112 44 94 52 86 64 Z" fill="#362f2d" />

  <!-- Eyebrows -->
  <path d="M96 90 Q106 87 114 91" stroke="#262626" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M126 91 Q134 87 144 90" stroke="#262626" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="106" cy="100" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="107.5" cy="98.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="134" cy="100" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="135.5" cy="98.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M119 104 Q121 116 117 118 Q122 119 123 118" stroke="#cf9b82" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile -->
  <path d="M109 130 Q120 138 131 130" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

