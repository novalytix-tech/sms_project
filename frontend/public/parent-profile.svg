  <path d="M126 90 Q134 86 144 90" stroke="#262626" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="106" cy="100" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="107.5" cy="98.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="134" cy="100" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="135.5" cy="98.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M119 104 Q121 116 117 118 Q122 119 123 118" stroke="#cf9b82" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Friendly Warm Smile -->
