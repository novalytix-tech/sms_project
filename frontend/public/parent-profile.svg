  <path d="M40 280 L40 228 C40 198 65 178 88 170 L106 215 L106 280 Z" fill="url(#parentJacket)" />
  <path d="M200 280 L200 228 C200 198 175 178 152 170 L134 215 L134 280 Z" fill="url(#parentJacket)" />

  <!-- Guardian Heart Pin -->
  <circle cx="68" cy="222" r="7.5" fill="#cf302d"/>
  <path d="M68 226 C68 226 64 223 64 220 C64 218 66 217 68 219 C70 217 72 218 72 220 C72 223 68 226 68 226 Z" fill="#ffffff"/>

