<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="teachFemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="100%" stop-color="#fee5df"/>
    </linearGradient>
    <linearGradient id="teachFemBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="teachFemSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8cfb7"/>
      <stop offset="100%" stop-color="#e8b497"/>
    </linearGradient>
    <linearGradient id="facultyRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="280" rx="20" fill="url(#teachFemBg)" />

  <!-- Subtle halo circle -->
  <circle cx="120" cy="115" r="75" fill="#fde2db" opacity="0.85"/>

  <!-- Back Hair (Neat Bun / Updo) -->
  <circle cx="120" cy="62" r="32" fill="#1c1917" />
  <path d="M74 100 C74 130 78 165 84 185 C90 188 94 180 94 165 C94 140 96 115 96 100 Z" fill="#1c1917" />
  <path d="M166 100 C166 130 162 165 156 185 C150 188 146 180 146 165 C146 140 144 115 144 100 Z" fill="#1c1917" />

  <!-- Neck & Base -->
  <path d="M106 138 L134 138 L138 174 L102 174 Z" fill="#deb095" />

  <!-- Silk Blouse / Inner Collar -->
  <polygon points="90,165 120,192 106,170" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <polygon points="150,165 120,192 134,170" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Faculty Lanyard / ID Ribbon -->
  <path d="M104 165 L116 220 L124 220 L136 165" stroke="url(#facultyRibbon)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Faculty Badge Card -->
  <rect x="111" y="218" width="18" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="113" y="222" width="14" height="4" rx="1" fill="#be123c"/>
  <circle cx="120" cy="232" r="3" fill="#94a3b8"/>

  <!-- Burgundy Faculty Blazer / Professional Attire -->
  <path d="M38 280 L38 226 C38 196 64 176 86 168 L104 212 L104 280 Z" fill="url(#teachFemBlazer)" />
  <path d="M202 280 L202 226 C202 196 176 176 154 168 L136 212 L136 280 Z" fill="url(#teachFemBlazer)" />
  <!-- Lapels -->
  <polygon points="86,168 106,220 120,198 106,168" fill="#9f1239" />
  <polygon points="154,168 134,220 120,198 134,168" fill="#9f1239" />

  <!-- Teacher Gold Brooch / Pin -->
  <circle cx="68" cy="220" r="7.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="68,215 72,223 64,223" fill="#fef3c7"/>

  <!-- Face -->
  <path d="M86 90 C86 62 154 62 154 90 C154 125 142 150 120 150 C98 150 86 125 86 90 Z" fill="url(#teachFemSkin)" />

  <!-- Ears & Pearl Earrings -->
  <ellipse cx="85" cy="100" rx="5" ry="10" fill="#dfad93"/>
  <circle cx="84" cy="106" r="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <ellipse cx="155" cy="100" rx="5" ry="10" fill="#dfad93"/>
  <circle cx="156" cy="106" r="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Hair Front (Graceful sweep) -->
  <path d="M84 86 C84 48 104 36 120 36 C140 36 156 50 156 86 C156 94 150 86 146 80 C138 72 128 68 120 68 C110 68 98 74 90 82 C86 86 84 90 84 86 Z" fill="#292524" />
  <path d="M88 78 C98 62 124 58 142 66 C150 72 152 82 152 88 C148 76 136 68 120 66 C106 64 94 70 88 78 Z" fill="#44403c" />

  <!-- Eyebrows -->
  <path d="M96 89 Q106 85 114 89" stroke="#2b2624" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M126 89 Q134 85 144 89" stroke="#2b2624" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Refined Spectacles (Teacher Glasses) -->
  <rect x="94" y="93" width="22" height="15" rx="4" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="124" y="93" width="22" height="15" rx="4" fill="none" stroke="#b45309" stroke-width="2"/>
  <line x1="116" y1="99" x2="124" y2="99" stroke="#b45309" stroke-width="2"/>
  <line x1="86" y1="97" x2="94" y2="97" stroke="#b45309" stroke-width="1.5"/>
  <line x1="146" y1="97" x2="154" y2="97" stroke="#b45309" stroke-width="1.5"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="105" cy="100.5" rx="3.5" ry="4" fill="#1c1917"/>
  <circle cx="106.5" cy="99" r="1.2" fill="#ffffff"/>
  <ellipse cx="135" cy="100.5" rx="3.5" ry="4" fill="#1c1917"/>
  <circle cx="136.5" cy="99" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M119 104 Q121 115 118 117 Q122 118 122 117" stroke="#ce9981" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Warm, encouraging smile -->
  <path d="M109 130 Q120 138 131 130" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

