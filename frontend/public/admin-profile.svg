<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f7"/>
      <stop offset="100%" stop-color="#fee2db"/>
    </linearGradient>
    <linearGradient id="adminSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="adminTie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="adminSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5caa6"/>
      <stop offset="100%" stop-color="#e2ad88"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="280" rx="20" fill="url(#adminBg)" />
  <circle cx="120" cy="115" r="75" fill="#fde2db" opacity="0.8"/>

  <!-- Neck & Base -->
  <path d="M106 140 L134 140 L138 178 L102 178 Z" fill="#deb095" />

  <!-- Crisp White Oxford Collar -->
  <polygon points="90,165 120,195 106,170" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="150,165 120,195 134,170" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Executive Burgundy Silk Tie -->
  <polygon points="113,170 127,170 130,183 120,189 110,183" fill="url(#adminTie)"/>
  <polygon points="112,185 128,185 133,252 120,268 107,252" fill="url(#adminTie)"/>
  <!-- Gold Tie Clip -->
  <rect x="110" y="214" width="20" height="3" rx="1" fill="url(#goldSeal)"/>

  <!-- Midnight Navy Executive Blazer -->
  <path d="M38 280 L38 228 C38 196 64 176 86 168 L104 214 L104 280 Z" fill="url(#adminSuit)" />
  <path d="M202 280 L202 228 C202 196 176 176 154 168 L136 214 L136 280 Z" fill="url(#adminSuit)" />
  <!-- Lapels -->
  <polygon points="86,168 106,224 120,200 106,168" fill="#312e81" />
  <polygon points="154,168 134,224 120,200 134,168" fill="#312e81" />

  <!-- Principal Gold Crest Emblem on Lapel -->
  <circle cx="68" cy="222" r="8" fill="url(#goldSeal)" stroke="#78350f" stroke-width="1.5"/>
  <polygon points="68,217 73,225 63,225" fill="#fef3c7"/>

  <!-- Face (Distinguished Principal) -->
  <path d="M84 92 C84 62 156 62 156 92 C156 128 144 154 120 154 C96 154 84 128 84 92 Z" fill="url(#adminSkin)" />

  <!-- Ears -->
  <ellipse cx="82" cy="102" rx="6" ry="11" fill="#deb095"/>
  <ellipse cx="158" cy="102" rx="6" ry="11" fill="#deb095"/>

  <!-- Hair (Salt and Pepper / Distinguished Silver Highlights) -->
  <path d="M82 86 C82 46 102 36 120 36 C140 36 158 46 158 86 C158 90 154 86 150 82 C144 76 136 74 126 74 C114 74 104 78 96 82 C88 86 82 89 82 86 Z" fill="#334155" />
  <path d="M86 78 C96 60 124 56 144 64 C152 70 154 82 154 86 C150 74 138 66 120 64 C104 62 92 68 86 78 Z" fill="#64748b" />

  <!-- Silver Wire-frame Glasses -->
  <rect x="93" y="93" width="23" height="15" rx="3.5" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="124" y="93" width="23" height="15" rx="3.5" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="116" y1="99" x2="124" y2="99" stroke="#64748b" stroke-width="2"/>
  <line x1="85" y1="97" x2="93" y2="97" stroke="#64748b" stroke-width="1.5"/>
  <line x1="147" y1="97" x2="155" y2="97" stroke="#64748b" stroke-width="1.5"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="104.5" cy="100.5" rx="3.5" ry="4" fill="#1c1917"/>
  <circle cx="106" cy="99" r="1.2" fill="#ffffff"/>
  <ellipse cx="135.5" cy="100.5" rx="3.5" ry="4" fill="#1c1917"/>
  <circle cx="137" cy="99" r="1.2" fill="#ffffff"/>

  <!-- Eyebrows with silver flecks -->
  <path d="M95 89 Q106 86 114 89" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M126 89 Q134 86 145 89" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M119 104 Q121 116 117 118 Q122 119 123 118" stroke="#cf9b82" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Distinguished Confident Smile -->
  <path d="M108 132 Q120 139 132 132" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

