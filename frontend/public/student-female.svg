<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="bgGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="100%" stop-color="#fee2db"/>
    </linearGradient>
    <linearGradient id="blazerGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ribbonGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf302d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="skinGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8cfb7"/>
      <stop offset="100%" stop-color="#ebb69b"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="280" rx="20" fill="url(#bgGradFem)" />

  <!-- Background subtle halo -->
  <circle cx="120" cy="115" r="75" fill="#fde2db" opacity="0.85"/>

  <!-- Back Hair (Pony/Length) -->
  <path d="M72 100 C68 135 64 185 70 215 C74 218 84 218 88 205 C92 180 94 150 94 130 Z" fill="#181514" />
  <path d="M168 100 C172 135 176 185 170 215 C166 218 156 218 152 205 C148 180 146 150 146 130 Z" fill="#181514" />

  <!-- Neck & Collar Base -->
  <path d="M107 140 L133 140 L137 178 L103 178 Z" fill="#e0b096" />

  <!-- White School Shirt Collar -->
  <polygon points="90,165 120,192 106,170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <polygon points="150,165 120,192 134,170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- School Ribbon Bow / Necktie -->
  <circle cx="120" cy="176" r="6" fill="url(#ribbonGradFem)"/>
  <path d="M120 176 L110 196 L116 198 L120 182 Z" fill="url(#ribbonGradFem)"/>
  <path d="M120 176 L130 196 L124 198 L120 182 Z" fill="url(#ribbonGradFem)"/>
  <circle cx="120" cy="176" r="2.5" fill="#fef3c7"/>

  <!-- Navy School Blazer -->
  <path d="M42 280 L42 230 C42 200 68 180 88 172 L106 215 L106 280 Z" fill="url(#blazerGradFem)" />
  <path d="M198 280 L198 230 C198 200 172 180 152 172 L134 215 L134 280 Z" fill="url(#blazerGradFem)" />
  <!-- Blazer Lapels -->
  <polygon points="88,172 108,225 120,200 106,170" fill="#2d3748" />
  <polygon points="152,172 132,225 120,200 134,170" fill="#2d3748" />

  <!-- School Crest Pin on Blazer -->
  <circle cx="68" cy="225" r="7" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="68,220 73,224 71,230 65,230 63,224" fill="#fef3c7"/>

  <!-- Face -->
  <path d="M86 92 C86 64 154 64 154 92 C154 126 142 152 120 152 C98 152 86 126 86 92 Z" fill="url(#skinGradFem)" />

  <!-- Ears -->
  <ellipse cx="85" cy="102" rx="5" ry="10" fill="#dfad93"/>
  <circle cx="85" cy="107" r="2" fill="#f59e0b" />
  <ellipse cx="155" cy="102" rx="5" ry="10" fill="#dfad93"/>
  <circle cx="155" cy="107" r="2" fill="#f59e0b" />

  <!-- Front Hair & Side Parting -->
  <path d="M83 88 C83 50 102 38 120 38 C142 38 157 52 157 88 C157 95 152 90 148 84 C140 76 130 72 120 72 C108 72 96 78 88 84 C85 86 83 91 83 88 Z" fill="#1e1b18" />
  <!-- Swept bangs -->
  <path d="M88 78 C100 60 125 58 142 66 C152 72 154 84 154 92 C150 78 136 68 120 66 C105 64 94 70 88 78 Z" fill="#362f2d" />

  <!-- Eyebrows -->
  <path d="M96 91 Q106 87 114 91" stroke="#2b2624" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M126 91 Q134 87 144 91" stroke="#2b2624" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="106" cy="101" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="107.5" cy="99.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="134" cy="101" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="135.5" cy="99.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M119 105 Q121 116 118 118 Q122 119 122 118" stroke="#ce9981" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile with Lip Glow -->
  <path d="M109 130 Q120 138 131 130" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>

