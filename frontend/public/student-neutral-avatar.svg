<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="bgGradNeut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f7"/>
      <stop offset="100%" stop-color="#fee7e2"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf302d"/>
      <stop offset="100%" stop-color="#8b1e22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="suitGradNeut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="280" rx="20" fill="url(#bgGradNeut)" />

  <!-- Shield / Crest Background -->
  <path d="M120 28 C165 28 190 45 190 95 C190 165 138 200 120 210 C102 200 50 165 50 95 C50 45 75 28 120 28 Z" fill="#ffffff" stroke="#fecdd3" stroke-width="2" opacity="0.95"/>

  <!-- Inner Seal / Crest Ring -->
  <circle cx="120" cy="108" r="58" fill="#fff5f5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Student Silhouette -->
  <!-- Shoulders / Uniform -->
  <path d="M80 165 C80 142 100 132 120 132 C140 132 160 142 160 165 Z" fill="url(#suitGradNeut)" />
  <polygon points="112,132 128,132 124,146 120,150 116,146" fill="url(#crestGrad)"/>
  <polygon points="106,132 120,146 114,136" fill="#ffffff"/>
  <polygon points="134,132 120,146 126,136" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="114" y="118" width="12" height="14" rx="3" fill="#cbd5e1" />

  <!-- Head -->
  <circle cx="120" cy="98" r="22" fill="#94a3b8" />

  <!-- Academic Cap / Student Crest Symbol -->
  <polygon points="120,68 152,78 120,88 88,78" fill="url(#crestGrad)" />
  <polygon points="120,87 142,80 142,88 120,95 98,88 98,80" fill="#991b1b" />
  <!-- Cap Tassel -->
  <line x1="120" y1="78" x2="148" y2="92" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="149" cy="94" r="2.5" fill="url(#goldGrad)"/>

  <!-- School Ribbon / Banner at Bottom -->
  <path d="M48 238 L72 225 L120 228 L168 225 L192 238 L176 254 L120 250 L64 254 Z" fill="url(#crestGrad)"/>
  <text x="120" y="244" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">VERIFIED STUDENT ID</text>
</svg>

